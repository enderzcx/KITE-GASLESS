server {
  listen 80;
  listen [::]:80;
  server_name __SERVER_NAME__;

  client_max_body_size 10m;

  # SSE stream endpoint (must disable buffering).
  location = /api/events/stream {
    proxy_pass http://127.0.0.1:3001/api/events/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-cache";
  }

  # All other backend APIs.
  location /api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Legacy path redirect.
  location = /agent-network {
    return 301 /;
  }

  # Legacy path redirect.
  location /agent-network/ {
    return 301 /;
  }

  # Agent Network (Next.js) on root.
  location / {
    proxy_pass http://127.0.0.1:4010;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}

# After DNS is ready, run:
#   sudo certbot --nginx -d __SERVER_NAME__
